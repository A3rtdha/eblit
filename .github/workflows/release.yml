name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true
        default: v1.6.0

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: copy config.example.json config.json
      - name: Build sing-box extended for Eblit
        run: |
          python tools/core/build.py --work-dir "$env:RUNNER_TEMP/eblit-core" --output sing-box.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; from app.setup.fetch import verify_singbox; verify_singbox(Path('sing-box.exe'))"
        shell: pwsh
      - run: python -m app.pack
        env:
          PYTHONUTF8: "1"
